{% extends 'layout.html' %}

{% block string %}
  <center>
    <h1>Makaleler</h1>
  </center>
  <div class="list-group">
    {% for article in articles %}
      <a href="articles/{{ article.id }}" class="list-group-item list-group-item-action flex-column align-items-start">
        <div class="d-flex w-100 justify-content-between">
          <h5 class="mb-1">{{ article.title }}</h5>
          <small class="text-muted">{{ article.create_date }}</small>
        </div>
        <p class="mb-1">{{ article.author }}</p>
      </a>
    {% endfor %}
  </div>
{% endblock %}
