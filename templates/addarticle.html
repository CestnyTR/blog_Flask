{% extends "layout.html" %}


{% block string %}
<center><h1>Makale Ekle</h1></center>

{% from "includes/_formhelpers.html" import render_field %}
<center>
  <form method="post">
    <dl>
      {{ render_field(form.title , class="form-control") }} 
      {{ render_field(form.content , class="form-control") }}
    </dl>

    <p><button type="submit" class="btn btn-info">Makaleyi yayınla</button></p>
  </form>
</center>

{% endblock string %}
